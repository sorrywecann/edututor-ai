name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read   # gitleaks-action lists PR commits via the API to scope the scan

jobs:
  secrets-check:
    name: Secrets check (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  backend-tests:
    needs: secrets-check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tutor-service

    steps:
      - uses: actions/checkout@v6

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -version | head -1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: tutor-service/requirements.txt

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify critical imports (prevent silent skip of RAG/memory tests)
        run: |
          python -c "import chromadb; print(f'chromadb {chromadb.__version__}')"
          python -c "import sentence_transformers; print(f'sentence_transformers {sentence_transformers.__version__}')"

      - name: Run tests
        run: python -m pytest tests/ --tb=short -q
        env:
          VECTOR_DB_BACKEND: chroma

      - name: Report skip count (alert if RAG/memory tests silently skipped)
        if: always()
        run: |
          SKIPS=$(python -m pytest tests/ --collect-only -q 2>&1 | grep -cE "^SKIPPED" || true)
          echo "::notice::Total skipped tests: $SKIPS (expected ≤2 — env override + digraph)"
          if [ "$SKIPS" -gt 5 ]; then
            echo "::warning::More than 5 tests skipped — RAG/memory likely silently skipping due to chromadb/sentence_transformers issue"
          fi

  frontend-build:
    needs: secrets-check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm tsc --noEmit

      - name: Unit tests (Vitest)
        run: pnpm test

      - name: Build
        run: pnpm build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
          NEXTAUTH_SECRET: ci-build-secret-not-for-production
          NEXTAUTH_URL: http://localhost:3000
