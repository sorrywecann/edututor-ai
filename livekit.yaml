# EduTutor.AI - LiveKit Server Configuration
# Development configuration for local testing

port: 7880
rtc:
  port_range_start: 7882
  port_range_end: 7892
  tcp_port: 7881
  use_external_ip: false

redis:
  address: redis:6379

keys:
  devkey: edututor_livekit_secret_key_32chars

logging:
  level: info
  json: false

room:
  empty_timeout: 300
  max_participants: 10

webhook:
  # Optional: Configure webhooks for room events
  # urls:
  #   - http://localhost:8000/api/v1/webhooks/livekit

turn:
  enabled: false
