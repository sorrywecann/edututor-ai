global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "edututor-backend"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["tutor-service:8000"]
        labels:
          service: "tutor-service"

  - job_name: "node-exporter"
    static_configs:
      - targets: ["node-exporter:9100"]
